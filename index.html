<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Glacier is a cinematic streaming platform with an icy, modern viewing experience." />
  <title>Glacier</title>
  <link rel="icon" type="image/svg+xml" href="assets/glacier-favicon.svg" />
  <link rel="stylesheet" href="css/glacier.css" />
</head>
<body>
  <header class="top-nav glass">
    <div class="brand">
      <img src="assets/glacier-logo.svg" alt="Glacier logo" class="logo" />
      <span>Glacier</span>
    </div>
    <nav>
      <button class="nav-link active" data-section="trending">Trending</button>
      <button class="nav-link" data-section="new">New Releases</button>
      <button class="nav-link" data-section="continue">Continue Watching</button>
      <button class="nav-link" data-section="top">Top Rated</button>
      <button class="nav-link" data-section="watchlist">Watchlist</button>
    </nav>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search titles, genres, or cast" />
      <div id="suggestions" class="suggestions"></div>
    </div>
  </header>

  <main>
    <section class="hero glass">
      <div>
        <p class="eyebrow">Featured on Glacier</p>
        <h1>Arctic Signal</h1>
        <p>A rescue crew decodes a mysterious transmission from beneath an ancient glacier shelf.</p>
        <div class="hero-actions">
          <button class="btn primary" data-play="Arctic Signal">Play</button>
          <button class="btn" data-watchlist="Arctic Signal">+ Watchlist</button>
        </div>
      </div>
    </section>

    <section id="trending" class="content-row"></section>
    <section id="new" class="content-row"></section>
    <section id="continue" class="content-row"></section>
    <section id="top" class="content-row"></section>
    <section id="watchlist" class="content-row"></section>

    <section class="player-wrap glass">
      <h2>Now Playing</h2>
      <video id="player" controls preload="metadata" poster="https://images.unsplash.com/photo-1482192597420-48108c2b0845?q=80&w=1200&auto=format&fit=crop">
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4" type="video/mp4" />
      </video>
      <p id="now-playing">Playing: Arctic Signal</p>
    </section>
  </main>

  <script src="js/glacier.js"></script>
</body>
</html>
